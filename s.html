<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>Fichier partagé</title>
<style>
:root{--bg:#0B0B0B;--line:#24262c;--gray:#8b8e96;--text:#ECECEE;--red:#FF073A}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:system-ui,"Segoe UI",sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.card{max-width:900px;width:100%;border:1px solid var(--line);border-radius:22px;padding:26px;background:radial-gradient(circle at 50% 0,#ff073a1f,transparent 60%),#0f1013;text-align:center}
.logo{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;background:#1a1b1f;color:var(--red);font-weight:800;font-size:19px;box-shadow:0 0 14px #ff073a88;margin:0 auto 14px}
.over{color:var(--red);font-size:11px;letter-spacing:.3em;text-transform:uppercase;margin-bottom:6px}
h1{font-family:Georgia,serif;font-size:24px;margin-bottom:10px;word-break:break-word}
p{color:#b9bbc2;line-height:1.6;margin:8px 0;font-size:14px}
.bar{height:6px;border-radius:6px;background:#1c1d22;overflow:hidden;margin:16px auto;max-width:420px}
.bar i{display:block;height:100%;width:0;background:var(--red);box-shadow:0 0 12px var(--red);transition:width .2s}
.media{margin:16px 0;max-width:100%}
.media img,.media video{max-width:100%;max-height:70vh;border-radius:14px;background:#000}
a.btn{display:inline-block;background:var(--red);color:#fff;text-decoration:none;border-radius:999px;padding:11px 22px;font-size:15px;margin-top:6px}
.small{font-size:12px;color:var(--gray)}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="logo">N</div>
  <div class="over">Fichier partagé</div>
  <h1 id="title">Déchiffrement…</h1>
  <div class="bar"><i id="prog"></i></div>
  <p id="msg" class="small">Le fichier est déchiffré ici, dans ton navigateur. La clé n'est jamais envoyée sur Internet.</p>
  <div class="media" id="media"></div>
  <div id="dl"></div>
</div>
<script>
// La clé est après le « # » : le navigateur ne l'envoie jamais à aucun serveur.
const h = new URLSearchParams(location.hash.slice(1));
history.replaceState(null, "", location.pathname);
const $ = id => document.getElementById(id);
const b64u = s => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), c => c.charCodeAt(0));
function fail(t, m){ $("title").textContent = t; $("msg").textContent = m; $("prog").parentNode.style.display = "none"; }
async function get(url){
  const r = await fetch(url, {cache: "no-store", referrerPolicy: "no-referrer"});
  if (!r.ok) throw new Error("expire");
  return new Uint8Array(await r.arrayBuffer());
}
(async () => {
  if (!h.get("m") || !h.get("k")) return fail("Lien incomplet", "Ce lien a été coupé. Demande à la personne de te le renvoyer en entier.");
  if (!crypto.subtle) return fail("Navigateur trop ancien", "Ouvre ce lien dans Chrome, Firefox, Safari ou Edge à jour.");
  let key, man;
  try {
    key = await crypto.subtle.importKey("raw", b64u(h.get("k")), "AES-GCM", false, ["decrypt"]);
    const raw = await get(new TextDecoder().decode(b64u(h.get("m"))));
    man = JSON.parse(new TextDecoder().decode(await crypto.subtle.decrypt({name: "AES-GCM", iv: raw.slice(0, 12)}, key, raw.slice(12))));
  } catch (e) {
    return fail("Lien expiré", "Ce partage n'est plus disponible : il ne dure que 24 heures.");
  }
  $("title").textContent = man.name;
  const prefix = b64u(man.prefix), parts = [];
  try {
    for (let i = 0; i < man.parts.length; i++) {
      const iv = new Uint8Array(12); iv.set(prefix, 0); new DataView(iv.buffer).setUint32(8, i);
      parts.push(new Uint8Array(await crypto.subtle.decrypt({name: "AES-GCM", iv}, key, await get(man.parts[i]))));
      $("prog").style.width = Math.round((i + 1) / man.parts.length * 100) + "%";
    }
  } catch (e) {
    return fail("Lien expiré", "Ce partage n'est plus disponible : il ne dure que 24 heures.");
  }
  const blob = new Blob(parts, {type: man.mime});
  const url = URL.createObjectURL(blob);
  $("prog").parentNode.style.display = "none";
  const el = document.createElement(man.kind === "video" ? "video" : "img");
  el.src = url;
  if (man.kind === "video") { el.controls = true; el.playsInline = true; }
  el.alt = man.name;
  $("media").appendChild(el);
  const until = new Date(man.expires * 1000);
  $("msg").textContent = "Disponible jusqu'au " + until.toLocaleString("fr-BE", {dateStyle: "short", timeStyle: "short"}) + ".";
  const a = document.createElement("a");
  a.className = "btn"; a.href = url; a.download = man.name; a.textContent = "⇩  Télécharger (" + (man.size / 1048576).toFixed(1) + " Mo)";
  $("dl").appendChild(a);
})();
</script>
</body>
</html>
